[package]
name = "homily-manager"
version = "1.0.0"
description = "Homily Manager desktop app"
authors = ["Homily Manager"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
